<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Prática React</title>
    <!-- Modo CDN dos slides (Intro 12-22): só para estudo, não para produção -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <style>
      body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
      .card { border: 1px solid #ccc; border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
      .selo { background: crimson; color: #fff; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      // No CDN não existe "import": os hooks vêm do objeto global React
      const { createContext, useContext, useState, useEffect } = React;

      // ====== Escreva sua prática aqui (veja a seção 11 do guia) ======

      function App() {
        const [count, setCount] = useState(0);
        return (
          <>
            <h1>Prática React</h1>
            <button onClick={() => setCount(old => old + 1)}>Cliques: {count}</button>
            {count >= 5 && <p>Você já clicou 5 vezes!</p>}
          </>
        );
      }

      // ================================================================

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
